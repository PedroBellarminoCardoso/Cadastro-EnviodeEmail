[project]
name = "projetocadastro2"
version = "0.1.0"
description = "Automação de cadastro no OrangeHRM"
authors = [
    {name = "Seu Nome", email = "seu-email@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "yagmail (>=0.16.0,<0.17.0)",
    "pywin32 (>=312,<313)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[project.scripts]
main = "OrangeHRM.Robots.main:main"

[tool.poetry]
packages = [
    { include = "OrangeHRM", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"